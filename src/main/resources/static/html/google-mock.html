<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión con Google</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f9;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background-color: #ffffff;
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e2e6;
        }
        .logo-g {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-blue { color: #4285F4; }
        .logo-red { color: #EA4335; }
        .logo-yellow { color: #FBBC05; }
        .logo-green { color: #34A853; }
        .logo-red-alt { color: #EA4335; }
        .input-custom {
            border: 1px solid #747775;
            border-radius: 4px;
            padding: 14px 16px;
            height: auto;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .input-custom:focus {
            border-color: #0b57d0;
            box-shadow: 0 0 0 1px #0b57d0;
            outline: none;
        }
        .btn-next {
            background-color: #0b57d0;
            color: #ffffff;
            font-weight: 600;
            border-radius: 100px;
            padding: 10px 24px;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-next:hover {
            background-color: #0a4ebd;
        }
        .error-msg {
            color: #b3261e;
            font-size: 0.8rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo-g">
            <span class="logo-blue">G</span><span class="logo-red">o</span><span class="logo-yellow">o</span><span class="logo-blue">g</span><span class="logo-green">l</span><span class="logo-red-alt">e</span>
        </div>
        <h3 class="text-center fs-4 mb-2" style="color: #1f1f1f; font-weight: 400;">Acceder</h3>
        <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">para continuar en <strong>FYNDR</strong></p>
        
        <form id="googleLoginForm" novalidate>
            <div class="mb-4">
                <input type="email" class="form-control input-custom" id="email" placeholder="Correo electrónico o teléfono" required>
                <div class="error-msg" id="emailError"></div>
            </div>
            <div class="mb-4">
                <input type="password" class="form-control input-custom" id="password" placeholder="Contraseña" required>
                <div class="error-msg" id="passwordError"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-5">
                <a href="#" class="text-decoration-none" style="color: #0b57d0; font-weight: 600; font-size: 0.9rem;">Crear cuenta</a>
                <button type="submit" class="btn-next">Siguiente</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('googleLoginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            const emailVal = emailInput.value.trim();
            if (!emailVal) {
                emailError.textContent = 'Introduce un correo electrónico o un número de teléfono.';
                emailInput.style.borderColor = '#b3261e';
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal) && !/^\d{10}$/.test(emailVal)) {
                emailError.textContent = 'Introduce un correo electrónico o número de teléfono válido.';
                emailInput.style.borderColor = '#b3261e';
                isValid = false;
            } else {
                emailError.textContent = '';
                emailInput.style.borderColor = '#747775';
            }

            const passwordVal = passwordInput.value;
            if (!passwordVal) {
                passwordError.textContent = 'Introduce una contraseña.';
                passwordInput.style.borderColor = '#b3261e';
                isValid = false;
            } else {
                passwordError.textContent = '';
                passwordInput.style.borderColor = '#747775';
            }

            if (isValid) {
                let name = 'Usuario Google';
                if (emailVal.includes('@')) {
                    const parts = emailVal.split('@')[0];
                    name = parts.charAt(0).toUpperCase() + parts.slice(1);
                }
                const encodedName = encodeURIComponent(name);
                const encodedEmail = encodeURIComponent(emailVal);
                window.location.href = '../index.html?social=google&name=' + encodedName + '&email=' + encodedEmail + '#registro';
            }
        });
    </script>
</body>
</html>

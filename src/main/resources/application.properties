# ==============================================================
# CONFIGURACIÓN LOCAL (Activa) - Para desarrollo y pruebas
# ==============================================================
spring.application.name=fyndr

spring.datasource.url=jdbc:mysql://localhost:3306/fyndr_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create, create-drop, update, validate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# JWT - Configuración del token
jwt.secret-key=EstaEsUnaClaveSecretaMuyLargaYSeguraParaMapearLosTokensDeJWTFyndr123!
jwt.expiration-ms=36000000

# Actuator - Health check endpoint
management.endpoints.web.exposure.include=health,info


spring.application.name=fyndr

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${PROD_DDL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT - Configuración del token (Obligatoria para la seguridad de la app)
jwt.secret-key=${JWT_SECRET_KEY:EstaEsUnaClaveSecretaMuyLargaYSeguraParaMapearLosTokensDeJWTFyndr123!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# Actuator - Health check
management.endpoints.web.exposure.include=health,info